[package]
name = "rogue-reborn"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.75"
byteorder = "1.5.0"
get-size = { version = "0.1.4", features = ["derive"] }
gl = "0.14.0"
glfw = "0.59.0"

[dev-dependencies]
glob = "0.3.1"
