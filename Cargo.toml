[package]
name = "rogue-reborn"
version = "0.1.0"
edition = "2024"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
get-size = ["dep:get-size"]

# The game client
[[bin]]
name = "rr"
path = "src/main.rs"

[[example]]
name = "map-dump"
required-features = ["serde"]

[[example]]
name = "map-stats"
required-features = ["get-size"]

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.75"
byteorder = "1.5.0"
get-size = { version = "0.1.4", optional = true, features = ["derive"] }
gl = "0.14.0"
glfw = "0.59.0"
rodio = { version = "0.22.2", default-features = false, features = ["wav", "playback"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
glob = "0.3.1"
